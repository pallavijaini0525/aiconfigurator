data_dir: data/b70 # relative to systems_dir
gpu:
  mem_bw: 608000000000 # 608GB/s - Intel Arc Pro B70 spec
  mem_bw_empirical_scaling_factor: 0.5 # standalone kernel bench shows ~220GB/s effective BW for mem-bound ops (RMSNorm/SiLU/Rotary), ~48% of 456GB/s spec
  mem_empirical_constant_latency: 0.000003 # 3us some nonofficial correction based on observations, you should try to modify based on your own observations
  mem_capacity: 32000000000 # 32GB - Intel Arc Pro B70 spec
  float32_tc_flops: 22940000000000 # 22.94TFLOPS FP32 - Intel Arc Pro B70 spec
  bfloat16_tc_flops: 183500000000000 # ~183.5TFLOPS BF16 - estimated as Int8(367TOPS)/2 for XMX architecture
  int8_tc_flops: 367000000000000 # 367TOPS Int8 - Intel Arc Pro B70 spec
  power: 230 # Watt (Total Board Power) - Intel Arc Pro B70 spec

node:
  num_gpus_per_node: 8 # check your # cards with sycl-ls
  inter_node_bw: 50000000000 # Byte/s per GPU, single direction, 1:1 CX7 per node, 50GB/s
  intra_node_bw: 28400000000    # PCIe bw without NVLink, Byte/s per GPU, single direction, limited by line rate and TLP header
  pcie_bw: 32000000000  # Byte/s, single direction, pcie 5.0 (4GB/s) x8 (8 lane for b60)
  p2p_latency: 0.000002  # 2us PCIe round-trip latency measured on B60 operated by GPU kernels

# TODO fix this with oneccl, use for memory usage computation
misc:
  nccl_mem: # some nonofficial correction based on observations, you should try to modify based on your own observations
    1: 0
    2: 358612992 # 342MB
    4: 411041792 # 392MB
    8: 411041792 # 392MB
  other_mem: 3758096384 # increase from 551MB to 3.5GB for safer deployment, this will cover part of the inaccurate mem calc.
  nccl_version: '2.23'
  oneccl_version: '2021.17.2'